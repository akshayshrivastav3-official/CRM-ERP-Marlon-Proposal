<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veloris ERP Software Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Veloris ERP | AI. Light and dark themes switch with data-theme on the root element. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --line:#e4e8f1;
  --fg:#111a2e; --muted:#667189; --accent:#2f5bff; --accent-fg:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --side-bg:#ffffff; --side-fg:#1c2640; --side-muted:#6b7690; --side-line:#e8ebf3; --side-hover:#f3f6fc; --side-active:#e8eeff;
  --c-crm:#12a594; --c-erp:#2f5bff; --c-ai:#e0a030; --c-pl:#8b97ad;
  --good:#0f8a4b; --good-bg:#e0f6ea; --warn:#9a6200; --warn-bg:#fdf1d3; --bad:#c0322a; --bad-bg:#fde5e2;
  --shadow:0 1px 2px rgba(20,30,60,.04),0 8px 24px rgba(20,30,60,.06);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#131a2e; --surface-2:#1a2340; --line:#26304d;
  --fg:#e8edf8; --muted:#97a3bd; --accent:#6b8bff; --accent-fg:#0a1230; --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface));
  --side-bg:#101729; --side-fg:#e3e9f6; --side-muted:#8a97b3; --side-line:#222c48; --side-hover:#18213b; --side-active:#1d2a55;
  --c-crm:#3cc9b8; --c-erp:#6b8bff;
  --good:#5fd695; --good-bg:#10301f; --warn:#f0c564; --warn-bg:#332a0e; --bad:#ff9a92; --bad-bg:#3a1714;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:276px minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--side-line)}
.brand{padding:20px 18px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none}
.brand b{font-size:16px;font-weight:600;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--c-crm)}
.brand span{font-size:12px;color:var(--side-muted)}
.side-search{padding:0 14px 12px}
.side-search input{width:100%;background:var(--side-hover);border:1px solid var(--side-line);color:var(--side-fg);border-radius:6px;padding:8px 10px;font-size:13px}
.side-search input::placeholder{color:var(--side-muted)}
.nav{flex:1;overflow-y:auto;padding:0 8px 12px;min-height:0}
.nav-home{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;font-weight:500;margin-bottom:6px}
.nav-home:hover,.nav-item:hover,.nav-sub a:hover{background:var(--side-hover)}
.nav-home.on,.nav-item.on{background:var(--side-active)}
.grp{margin-top:6px}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);font-weight:600;border-radius:6px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{color:var(--side-fg)}
.grp>summary .n{margin-left:auto;font-weight:500;letter-spacing:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c-pl);flex:none;display:inline-block}
.dot-CRM{background:var(--c-crm)} .dot-ERP{background:var(--c-erp)} .dot-AI{background:var(--c-ai)} .dot-Platform{background:var(--c-pl)}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 26px;border-radius:6px;text-decoration:none;font-size:13.5px}
.nav-item .c{margin-left:auto;font-size:11.5px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.nav-sub{margin:2px 0 6px 26px;padding-left:10px;border-left:1px solid var(--side-line);display:flex;flex-direction:column}
.nav-sub a{padding:5px 8px;border-radius:5px;font-size:12.5px;color:var(--side-muted);text-decoration:none}
.nav-sub a.on{color:var(--side-fg);background:var(--side-hover)}
.found{padding:2px 4px;display:flex;flex-direction:column;gap:2px}
.found a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;font-size:13px}
.found a small{display:block;color:var(--side-muted);font-size:11.5px}
.found a:hover{background:var(--side-hover)}
.side-foot{padding:12px 14px;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:8px}
.side-foot button{background:transparent;border:1px solid var(--side-line);color:var(--side-fg);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}
.side-foot button:hover{background:var(--side-hover)}

/* main */
.main{overflow-y:auto;min-width:0;min-height:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 32px}
.crumbs{flex:1;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--fg);font-weight:500}
.chip{font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:3px 10px;border-radius:999px;white-space:nowrap}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.page{padding:28px 32px 56px;max-width:1240px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.012em;margin-top:6px;text-wrap:balance}
.lede{color:var(--muted);margin-top:8px;max-width:68ch}
h2{font-size:18px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
h3{font-size:15px;font-weight:600}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;display:block}
.kpi:hover{border-color:var(--accent)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}
.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head p{color:var(--muted);font-size:13px}
.chains{display:flex;flex-direction:column;gap:10px}
.chain{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chain-t{font-size:12px;font-weight:600;color:var(--muted);width:100%}
.step{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;padding:5px 10px;border-radius:6px;background:var(--surface-2);border:1px solid transparent}
.step:hover{border-color:var(--accent);color:var(--accent)}
.step.erp{box-shadow:inset 0 -2px 0 var(--c-erp)} .step.crm{box-shadow:inset 0 -2px 0 var(--c-crm)}
.arrow{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.mcard h3{display:flex;align-items:center;gap:8px}
.mcard p{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .meta{font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.feed-row{display:grid;grid-template-columns:120px 170px minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.feed-row:first-child{border-top:0}
.feed-row time{color:var(--muted);font-variant-numeric:tabular-nums}
.feed-row span{color:var(--muted);overflow-wrap:anywhere}

/* module page */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:22px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:none;padding:9px 14px;text-decoration:none;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.panel{margin-top:22px}
.panel-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.panel-head p{color:var(--muted);margin-top:4px;max-width:70ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.formcard{margin-top:18px;padding:18px}
.formcard h3{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld.wide{grid-column:1/-1}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
.fld textarea{min-height:76px;resize:vertical}
.fld.chk{flex-direction:row;align-items:center;gap:8px;padding-top:22px}
.fld.chk span{font-size:13.5px;color:var(--fg)}
.fld.chk input{width:18px;height:18px;accent-color:var(--accent)}
.form-foot{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px}
.toolbar{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.toolbar input{flex:1 1 240px;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.tablewrap{margin-top:12px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:620px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{white-space:nowrap;text-align:right}
td.act .btn{margin-left:6px}
tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.code{font-family:var(--mono);font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:10px}

/* copilot */
.chat{margin-top:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding-right:4px}
.msg{max-width:78ch;padding:9px 12px;border-radius:8px;font-size:13.5px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.bot{align-self:flex-start;background:var(--surface-2)}
.msg small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:30;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav-open .side{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .menu-btn{display:inline-block}
  .topbar{padding:10px 16px}
  .page{padding:22px 16px 48px}
  h1{font-size:24px}
  .feed-row{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){.side,.toast{transition:none}}

.grp-t{margin:20px 0 10px;font-size:13px;color:var(--muted);font-weight:600}

.who{font-size:13px;color:var(--muted);white-space:nowrap}
.step.off{opacity:.45;cursor:not-allowed;background:transparent;border:1px dashed var(--line)}
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:var(--side-bg);color:var(--side-fg);padding:56px 48px;display:flex;align-items:center}
.login-art-in{max-width:470px}
.login-art .logo{font-size:16px;font-weight:600;letter-spacing:.01em}
.login-art .logo i{font-style:normal;color:var(--c-crm)}
.login-art h1{font-size:32px;line-height:1.2;margin-top:30px;color:var(--side-fg)}
.login-art p{color:var(--side-muted);margin-top:14px}
.login-art ul{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:12px}
.login-art li{display:flex;gap:10px;align-items:center;font-size:14px}
.login-box{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.login-card{width:100%;max-width:400px;padding:28px;display:flex;flex-direction:column;gap:16px}
.login-card .btn.primary{padding:10px 14px}
@media (max-width:900px){
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{padding:28px 16px}
  .login-art h1{font-size:24px;margin-top:20px}
  .login-art ul{display:none}
  .login-box{padding:24px 16px}
}
@media (max-width:640px){.chip,.who{display:none}}

/* ---- UI kit additions ---- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
a.btn{text-decoration:none;display:inline-block;line-height:1.3}
.rowlink{font-weight:500;text-decoration:none;color:var(--accent)}
.rowlink:hover{text-decoration:underline}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.foot-link{color:var(--side-fg);text-decoration:none;padding:6px 8px;border-radius:6px}
.foot-link:hover{background:var(--side-hover)}
.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0}
.stepper li{list-style:none;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.stepper li.done{background:var(--accent-soft);color:var(--fg);border-color:transparent}
.stepper li.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.cols2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.side-card{padding:16px 18px}
.side-card h3{margin-bottom:4px}
.kv{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);margin:6px 0 0}
.kv dt,.kv dd{margin:0;padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.kv dt:first-of-type,.kv dt:first-of-type+dd{border-top:0}
.kv dt{color:var(--muted);font-size:13px}
.plist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:13px}
.plist a{color:var(--accent);text-decoration:none}
.plist a:hover{text-decoration:underline}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.fcard{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard p{color:var(--muted);font-size:13px}
.fcard .acts{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap;align-items:center}
.meta-row{display:flex;gap:6px;flex-wrap:wrap}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:20px}
.tpl{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:3px 7px;border-radius:4px;overflow-wrap:anywhere;align-self:flex-start}
pre.codeblock{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:0 0 14px}
.matrix{min-width:560px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--good);font-weight:600}
.no{color:var(--muted)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.switch-row:first-of-type{border-top:0}
.switch-row input{width:18px;height:18px;accent-color:var(--accent);flex:none}
@media (max-width:900px){
  .cols2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{padding-bottom:0}
  .kv dd{border-top:0;padding-top:2px}
  .kv dt:first-of-type{border-top:0}
}

/* ===== v2: app shell like a real SaaS product ===== */
body{font-family:var(--sans);font-feature-settings:"cv11","ss01"}
.app{grid-template-columns:268px minmax(0,1fr);grid-template-rows:72px minmax(0,1fr)}
.topbar{grid-column:1/-1;grid-row:1;position:relative;z-index:12;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
.side{grid-row:2;background:var(--side-bg);color:var(--side-fg);border-right:1px solid var(--side-line);overflow:hidden}
.main{grid-row:2}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.tb-brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.tb-brand b i{font-style:normal;color:var(--accent)}

/* sidebar */

.sec-head h2{font-size:19px;font-weight:700}

.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;padding:0}

/* header link */
.tb-link{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.tb-link:hover{filter:brightness(1.08)}
/* journeys */
.chain-d{width:100%;color:var(--muted);font-size:13px;margin:-2px 0 4px}
.step{flex-direction:column;align-items:flex-start;gap:1px;position:relative;padding:7px 12px}

var EXACT={high:'bad',critical:'bad',major:'bad',serious:'bad',medium:'warn',moderate:'warn','new':'warn',open:'warn',draft:'warn',due:'warn',down:'bad',fair:'warn',poor:'bad',good:'good',normal:'good',active:'good',inactive:'bad',closed:'good',negative:'bad',positive:'good',ready:'warn',done:'good',queued:'warn'};

function tone(v){
  var s=String(v).toLowerCase();
  if(EXACT.hasOwnProperty(s)) return EXACT[s];
  var i;
  for(i=0;i<BAD.length;i++) if(s.indexOf(BAD[i])>-1) return 'bad';
  for(i=0;i<WARN.length;i++) if(s.indexOf(WARN[i])>-1) return 'warn';
  for(i=0;i<GOOD.length;i++) if(s.indexOf(GOOD[i])>-1) return 'good';

}

    case 'n': return Number(v).toLocaleString('en-US')+(/%$/.test(f.label)?'%':'');
    case 'd': return esc(fmtDate(v));
    case 'b': return v?'Yes':'No';
    case 's': return (tone(v)||STATUSLIKE.test(f.label))?badge(v):esc(v);
    default:
      if(/^[A-Z]{1,4}-\d+$/.test(v)) return '<span class="code">'+esc(v)+'</span>';

  try{if(location.hash.slice(1)!==h) location.hash=h;}catch(e){}
  mount();
}
window.__nav=function(url){var h=toHash(url);if(h===null){location.href=url;return;}go(h);};
V.route=function(){
  var i0=cur.indexOf('-'),a=i0<0?'':cur.slice(i0+1);
  var p=a.split('.'),m=V.MBY[p[0]]||null,i=0;
  if(m){i=parseInt(p[1],10);if(!(i>=0&&i<m.fs.length)) i=0;}
  return {m:m,i:i,ft:m?m.fs[i]:null,rid:(m&&p[2])?p[2]:null};
};
V.onRoute=function(fn){fn();};
V.arg=function(){var i=cur.indexOf('-');return i<0?'':cur.slice(i+1);};
function pageName(){
  var i=cur.indexOf('-'),p=i<0?cur:cur.slice(0,i);
  if(!Pages[p]) p=V.session()?'dashboard':'login';
  return p;
}
function mount(){
  gen++;
  tracked.forEach(function(t){document.removeEventListener(t[0],t[1],t[2]);});tracked=[];
  var p=pageName();
  var t=V.el('toast');if(t) t.classList.remove('show');
  document.body.classList.remove('nav-open');
  document.body.setAttribute('data-template',p);
  V.el('login').hidden=(p!=='login');V.el('app').hidden=(p==='login');
  document.addEventListener=function(ty,f,o){tracked.push([ty,f,o]);addL(ty,f,o);};
  try{Pages[p]();}finally{document.addEventListener=addL;}
}
addL('click',function(e){
  var t=e.target;if(!t||!t.closest) return;
  /* submit buttons: run the form handlers directly, so forms work even where the browser blocks form submission */
  var b=t.closest('button');
  if(b&&b.form&&!b.disabled&&(b.getAttribute('type')||'submit')==='submit'){
    e.preventDefault();
    b.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    return;
  }
  var a=t.closest('a[href]');if(!a) return;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button) return;
  var h=toHash(a.getAttribute('href'));if(h===null) return;
  e.preventDefault();go(h);
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h!==cur){cur=h;mount();}});
window.__spaStart=mount;
})();

  t=t.toLowerCase();var R=V.R,sum=V.sum,fm=V.fmtMoney;
  if(/customer/.test(t)&&!/owe|pay/.test(t)){
    var c=R('customer360',0),a=c.filter(function(r){return r.Status==='Active';}).length;
    return {text:'You have '+c.length+' customer records, and '+a+' of them are active.',src:'Customer 360 › Unified Customer Records',mod:'Customer 360',ok:true};
  }
  if(/case|ticket|support/.test(t)){
    var cs=R('service',0).filter(function(r){return r.Status==='New'||r.Status==='In progress';});
    var hot=cs.filter(function(r){return r.Priority==='High'||r.Priority==='Critical';});
    return {text:cs.length+' cases are open'+(hot.length?', and '+hot.length+' of them are high or critical priority. The first one is "'+hot[0].Subject+'" for '+hot[0].Customer+'.':'.'),src:'Customer Service › Case Management',mod:'Service',ok:true};
  }
  if(/pipeline|deal|opportunit|forecast/.test(t)){
    var p=R('sales',1).filter(function(r){return String(r.Stage||'').indexOf('Closed')!==0;});
    return {text:'The open pipeline is '+fm(sum(p,'Amount'))+' across '+p.length+' opportunities.',src:'Sales › Opportunity Management',mod:'Sales',ok:true};
  }
  if(/owe|receivable|invoice|overdue|cash|payment/.test(t)){
    var ar=R('finance',5).filter(function(r){return r.Status!=='Paid';});
    var od=ar.filter(function(r){return r.Status==='Overdue';});
    return {text:'Customers owe '+fm(sum(ar,'Amount'))+' across '+ar.length+' open invoices. '+od.length+' of them are overdue, worth '+fm(sum(od,'Amount'))+'.',src:'Finance › Accounts Receivable',mod:'Finance',ok:true};
  }
  if(/stock|inventory|reorder/.test(t)){
    var low=R('supply',0).filter(function(r){return r.Status==='Low stock'||r.Status==='Out of stock';});
    return {text:low.length?low.length+' stock lines need attention: '+low.slice(0,3).map(function(r){return r.Item+' at '+r.Location+' ('+r.Status.toLowerCase()+')';}).join('; ')+'.':'No stock lines are low or out of stock right now.',src:'Supply Chain › Multi-Location Inventory',mod:'Inventory',ok:true};
  }
  if(/approv|pending|waiting/.test(t)){
    var n=function(m,i){return R(m,i).filter(function(r){return r.Status==='Pending approval';}).length;};
    var qn=n('sales',3),pr=n('procurement',0),jv=n('finance',2);
    return {text:(qn+pr+jv)+' items are waiting for approval: '+qn+' quotes, '+pr+' purchase requisitions and '+jv+' journals.',src:'Sales › CPQ, Procurement › Purchase Requisitions, Finance › Journal Controls',mod:'Finance',ok:true};
  }
  return {text:'I can answer from governed data on customers, open cases, pipeline, receivables, stock and approvals. Try one of the suggestions below.',src:'',mod:'Customer 360',ok:false};
}
function ask(text){
  var a=answer(text);

  var ft=V.FBY['ai.0'];

  V.addAudit('Copilot','Answered a question','Conversational Copilot · '+text.slice(0,60));

}

});

/* Template: Software flow (softflow.html#usage | tech | handoffs). How a customer uses the software, how the technology works, how CRM and ERP hand work to each other. */
Pages.softflow=function(){
if(!V.boot()) return;

var TABS=[['usage','How a customer uses it'],['tech','How the technology works'],['handoffs','CRM ↔ ERP handoffs']];

/* ---------- 1. customer journey map ---------- */

 {t:'Reaches out',c:'#3b82f6',i:'headset',cust:'Chats on the website, emails or calls.',crm:['leads.0'],erp:[],ai:['ai.1'],note:'A lead is created and the customer\'s consent is recorded.'},
 {t:'Gets a quote',c:'#10b981',i:'file',cust:'Receives a price within minutes, not days.',crm:['leads.1','sales.1','sales.3'],erp:[],ai:['ai.4','ai.7'],note:'A discount above the limit waits for a human to approve.'},
 {t:'Signs and orders',c:'#f59e0b',i:'briefcase',cust:'Accepts the quote and places the order.',crm:['sales.4','sales.5'],erp:['sd.0'],ai:['ai.15'],note:'Credit is checked and stock is reserved automatically.'},
 {t:'Receives the goods',c:'#06b6d4',i:'truck',cust:'Tracks the order and gets it delivered.',crm:['service.1'],erp:['supply.3','warehouse.2','logistics.1'],ai:['ai.9'],note:'Same live data in every team, so nothing is re-keyed.'},
 {t:'Is billed and pays',c:'#8b5cf6',i:'wallet',cust:'Gets the invoice and pays it.',crm:[],erp:['sd.3','finance.5','finance.9'],ai:[],note:'Payment status shows back in the customer record.'},
 {t:'Gets support',c:'#f97316',i:'heart',cust:'Raises an issue and gets a fast, informed reply.',crm:['service.0','service.5','service.4'],erp:['assets.0'],ai:['ai.5','ai.13'],note:'The outcome is written to the asset history.'},
 {t:'Stays and grows',c:'#ec4899',i:'trend',cust:'Gets relevant offers and renews.',crm:['cx.0','sales.5'],erp:['epm.3'],ai:['ai.6'],note:'Renewals feed billing and the forecast.'}

/* ---------- 2. technology: layers and a step-by-step trace ---------- */
var P=[['Customer','#3b82f6','users'],['Channel','#06b6d4','headset'],['AI agents','#8b5cf6','sparkles'],['CRM','#12a594','funnel'],['ERP','#2f5bff','cube'],['Controls','#f59e0b','shield'],['Human','#ec4899','idcard'],['Audit trail','#64748b','file']];
var SC={
 late:{t:'Late order enquiry',d:'The agent resolves it alone',steps:[
  [0,1,'Emails "Where is my order?"','Sends an email from their usual address.','Omnichannel Support receives it and matches it to the customer record.','message.received','POST /channels/email/inbound','Interaction on the customer timeline',['service.1','customer360.3']],
  [1,2,'Routes to the Copilot','Nothing yet. The reply is being prepared.','The Copilot picks the message up with the customer\'s consent profile attached.','case.routed','POST /agents/copilot/sessions','Agent session',['ai.0','customer360.4']],
  [2,3,'Opens the unified record','Nothing yet.','It reads the customer record, timeline and open orders. It only sees what its role allows.','record.read','GET /graph/customers/{id}','Customer record, timeline',['customer360.0','customer360.1']],
  [2,3,'Creates a service case','Gets a case reference.','A case with an SLA timer is created and published as an event for everyone who needs it.','case.opened','POST /cases','Case',['service.0']],
  [2,4,'Checks order, picking and shipment','Nothing yet.','The Service Agent reads the sales order, warehouse picking and shipment live from the same data.','order.status.read','GET /graph/orders/{id}/status','Sales order, pick list, shipment',['sales.4','warehouse.2','logistics.1']],
  [2,5,'Asks: can I act alone?','Nothing yet.','Autonomy Controls check the agent\'s authority for this action and record the reasoning.','policy.evaluated','POST /policy/evaluate','Policy decision',['ai.15','platform.15']],
  [2,0,'Sends an accurate update','Receives the real status and a new delivery date.','The reply goes out through the same channel, the case is resolved and a CSAT request follows.','case.resolved','POST /channels/email/outbound','Case, CSAT request',['service.3','service.0']],
  [2,7,'Writes who, what, when, why','Nothing. This is for evidence later.','Every step above is permanently logged with its reasoning, by person or agent alike.','audit.recorded','POST /audit/entries','Audit entry',['platform.14']]]},
 refund:{t:'Refund above the limit',d:'A human approves',steps:[
  [0,1,'Asks for a refund on a faulty item','Writes in through chat.','The message is matched to the customer and the order.','message.received','POST /channels/chat/inbound','Interaction',['service.1']],
  [1,2,'The Service Agent takes the case','Nothing yet.','It opens the case with full history.','case.opened','POST /cases','Case',['ai.5','service.0']],
  [2,3,'Checks warranty and entitlement','Nothing yet.','It routes the request by what the customer is covered for.','entitlement.checked','GET /entitlements/{customer}','Warranty record',['service.5']],
  [2,4,'Finds the invoice and payment','Nothing yet.','It reads the invoice and receivable for the order.','invoice.read','GET /graph/invoices/{id}','Invoice, receivable',['sd.3','finance.5']],
  [2,5,'Refund is above its authority','Told a person will confirm.','Approval gates stop anything above the agent\'s limit and ask a human.','approval.required','POST /policy/evaluate','Policy decision',['ai.15']],
  [5,6,'Approval request with full context','Nothing yet.','A task with the case, order and invoice attached is placed in the approver\'s queue.','task.created','POST /workflow/tasks','Workflow task',['platform.6']],
  [6,4,'Approves, credit note posted','Nothing yet.','The approval is recorded and the credit note posts to the ledger.','creditnote.posted','POST /finance/credit-notes','Credit note, ledger entry',['finance.5','finance.3']],
  [4,0,'Refund confirmation sent','Gets a confirmation and the refund date.','The customer is told, and the case is closed.','case.resolved','POST /channels/chat/outbound','Case',['service.0']],
  [6,7,'Approval and reasoning logged','Nothing. This is for evidence later.','Who approved, on what evidence, is permanently recorded.','audit.recorded','POST /audit/entries','Audit entry',['platform.14']]]},
 sale:{t:'New sale: lead to cash',d:'CRM sells, ERP fulfils',steps:[
  [0,1,'Asks for a quote in chat','Types a question on the website.','Conversational Lead Capture takes the details and consent.','lead.captured','POST /leads','Lead',['leads.0']],
  [1,2,'SDR Agent scores and qualifies','Nothing yet.','The lead is scored, enriched and routed to the right owner.','lead.scored','POST /agents/sdr/score','Lead score',['leads.1','ai.1']],
  [2,3,'Lead becomes contact, account and deal','Nothing yet.','Lead Conversion Mapping creates the records in one step.','opportunity.created','POST /leads/{id}/convert','Contact, account, opportunity',['leads.2','sales.1']],
  [2,3,'Quote Agent builds the quote','Receives a quote from the price book.','Prices, tax rules and discounts are applied from the price book.','quote.created','POST /quotes','Quote',['sales.3','ai.4']],
  [3,5,'Discount above the limit needs approval','Nothing yet.','Approval gates stop it and ask a person.','approval.required','POST /policy/evaluate','Policy decision',['ai.15']],
  [6,3,'Sales manager approves, quote sent','Gets the approved quote.','The approval is recorded and the quote is released.','quote.approved','POST /quotes/{id}/approve','Quote approval',['sales.3']],
  [3,4,'Order created, credit checked, stock reserved','Signs and orders.','The sales order flows to ERP, which checks credit and reserves stock.','order.created','POST /sales-orders','Sales order, reservation',['sales.4','sd.0','supply.3']],
  [4,4,'Pick, pack and ship','Receives the goods.','Warehouse and logistics fulfil the order from the same record.','shipment.delivered','POST /shipments','Pick list, shipment',['warehouse.2','logistics.1']],
  [4,0,'Invoice issued and paid','Gets the invoice and pays.','Billing posts the invoice and the receivable.','invoice.posted','POST /invoices','Invoice, receivable',['sd.3','finance.5']],
  [4,3,'Revenue and payment status back in CRM','Nothing yet.','Revenue is recognised and the payment status shows on the customer record.','revenue.recognised','POST /finance/revenue','Revenue entry',['finance.9','customer360.1']],
  [4,7,'Everything logged','Nothing. This is for evidence later.','Each handoff is recorded in the audit trail.','audit.recorded','POST /audit/entries','Audit entry',['platform.14']]]}
};
var curSc='late',curStep=0,timer=null;
function seq(){
  var sc=SC[curSc],n=P.length,W=1000,X0=70,DX=(W-2*X0)/(n-1),Y0=96,RH=56,H=Y0+sc.steps.length*RH+24;
  var x=function(i){return X0+i*DX;};
  var s='<svg class="sq" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Step by step trace of '+esc(sc.t)+'"><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>';
  P.forEach(function(p,i){
    s+='<line class="ll" x1="'+x(i)+'" x2="'+x(i)+'" y1="62" y2="'+(H-8)+'"/>'
     +'<g><rect x="'+(x(i)-52)+'" y="12" width="104" height="46" rx="12" style="fill:color-mix(in srgb,'+p[1]+' 16%,var(--surface));stroke:'+p[1]+'"/><text class="pt" x="'+x(i)+'" y="40" text-anchor="middle">'+esc(p[0])+'</text></g>';
  });
  sc.steps.forEach(function(st,k){
    var y=Y0+k*RH,a=x(st[0]),b=x(st[1]),cls='sm'+(k===curStep?' on':k<curStep?' done':'');
    s+='<g class="'+cls+'" data-act="sq-step" data-k="'+k+'" tabindex="0" role="button" aria-label="Step '+(k+1)+': '+esc(st[2])+'">';
    var mid=(a+b)/2,lw=Math.min(300,st[2].length*6.6+16);
    if(st[0]===st[1]){
      s+='<path class="ln" d="M'+a+' '+(y-14)+' h46 v28 h-46" fill="none" marker-end="url(#ar)"/><rect class="lb" x="'+(a+54)+'" y="'+(y-11)+'" width="'+lw+'" height="22" rx="6"/><text x="'+(a+62)+'" y="'+(y+4)+'">'+esc(st[2])+'</text>';
    }else{
      var dir=b>a?1:-1;
      s+='<line class="ln" x1="'+a+'" y1="'+y+'" x2="'+(b-dir*2)+'" y2="'+y+'" marker-end="url(#ar)"/><rect class="lb" x="'+(mid-lw/2)+'" y="'+(y-34)+'" width="'+lw+'" height="22" rx="6"/><text x="'+mid+'" y="'+(y-19)+'" text-anchor="middle">'+esc(st[2])+'</text>';
    }
    s+='<circle class="nm" cx="'+(a)+'" cy="'+y+'" r="11"/><text class="nt" x="'+a+'" y="'+(y+4)+'" text-anchor="middle">'+(k+1)+'</text>'
     +'<circle class="ad" cx="'+x(7)+'" cy="'+y+'" r="'+(k===curStep?6:4)+'"/><rect x="0" y="'+(y-RH/2)+'" width="'+W+'" height="'+RH+'" fill="transparent"/></g>';
  });
  return s+'</svg>';
}
function detail(){
  var sc=SC[curSc],st=sc.steps[curStep],k=curStep,n=sc.steps.length;
  return '<div class="sq-d"><div class="sq-dh"><span class="g-num" style="--kc:var(--accent)">'+(k+1)+'</span><div><span class="g-tag">Step '+(k+1)+' of '+n+' · '+esc(P[st[0]][0])+' → '+esc(P[st[1]][0])+'</span><h3>'+esc(st[2])+'</h3></div></div>'
   +'<div class="sq-dg"><div><h4>What the customer sees</h4><p>'+esc(st[3])+'</p></div><div><h4>What the software does</h4><p>'+esc(st[4])+'</p></div>'
   +'<div><h4>Under the hood</h4><dl class="tech"><dt>Event</dt><dd><code>'+esc(st[5])+'</code></dd><dt>API call</dt><dd><code>'+esc(st[6])+'</code></dd><dt>Records</dt><dd>'+esc(st[7])+'</dd></dl></div>'
   +'<div><h4>Open the screens</h4><div class="connects" style="margin-top:6px">'+st[8].map(function(id){return chipF(id);}).join('')+'</div></div></div></div>';
}
function tech(){
  var L=[['Channels','Web, mobile, voice, chat, email and partner systems','#3b82f6','users',['platform.8','platform.9']],
   ['AI agent workforce','The Copilot and 16 governed agents, each inside approved limits','#8b5cf6','sparkles',['ai.0','ai.15','platform.15']],
   ['Business modules','21 CRM and ERP modules working on one shared record','#10b981','cube',['sales.0','finance.0','supply.0']],
   ['Platform foundation','Data graph, event backbone, workflow, identity, consent, encryption, audit','#f59e0b','layers',['platform.0','platform.1','platform.6','platform.10','platform.12','platform.14','platform.20']]];
  var h=head('How the technology works','Every request enters through a channel, passes the gateway, is handled by people or governed agents, runs on the business modules and is recorded by the platform. The player below traces real examples through these layers.');
  h+='<div class="tl">'+L.map(function(l,i){return '<section class="card tl-l" style="--kc:'+l[2]+'"><span class="g-ic">'+ic(l[3],22)+'</span><div><h3>'+esc(l[0])+'</h3><p class="note">'+esc(l[1])+'</p><div class="connects" style="margin-top:8px">'+l[4].map(function(id){return chipF(id);}).join('')+'</div></div></section>'+(i<L.length-1?'<div class="tl-ar" aria-hidden="true">↓ <span>'+(i===0?'requests in, answers out':i===1?'agents act on modules':'every module reads and writes one record')+'</span> ↑</div>':'');}).join('')+'</div>';
  h+='<h3 class="grp-t" style="margin-top:30px">Trace it step by step</h3><div class="sc-tabs">'+Object.keys(SC).map(function(k){return '<button type="button" class="sc-tab'+(k===curSc?' on':'')+'" data-act="sq-sc" data-k="'+k+'"><b>'+esc(SC[k].t)+'</b><small>'+esc(SC[k].d)+'</small></button>';}).join('')+'</div>'
   +'<div class="sq-bar"><button type="button" class="btn sm" data-act="sq-prev">Previous</button><button type="button" class="btn sm primary" data-act="sq-next">Next step</button><button type="button" class="btn sm" data-act="sq-play">'+(timer?'Pause':'Play')+'</button><button type="button" class="btn sm" data-act="sq-reset">Restart</button><span class="note" style="margin:0 0 0 auto">Click any step in the diagram to jump to it.</span></div>'
   +'<div class="card sq-wrap" id="sq">'+seq()+'</div><div class="card" id="sqd">'+detail()+'</div>';
  return h;
}
function refreshSeq(){var a=V.el('sq'),b=V.el('sqd');if(a) a.innerHTML=seq();if(b) b.innerHTML=detail();var pb=document.querySelector('[data-act=sq-play]');if(pb) pb.textContent=timer?'Pause':'Play';}
function stop(){timer=null;}
function tick(){if(!timer) return;var n=SC[curSc].steps.length;if(curStep>=n-1){stop();refreshSeq();return;}curStep++;refreshSeq();timer=setTimeout(tick,2400);}
V.act('sq-step',function(b){stop();curStep=parseInt(b.getAttribute('data-k'),10);refreshSeq();});
V.act('sq-next',function(){stop();curStep=Math.min(SC[curSc].steps.length-1,curStep+1);refreshSeq();});
V.act('sq-prev',function(){stop();curStep=Math.max(0,curStep-1);refreshSeq();});
V.act('sq-reset',function(){stop();curStep=0;refreshSeq();});
V.act('sq-play',function(){if(timer){stop();refreshSeq();return;}if(curStep>=SC[curSc].steps.length-1) curStep=0;timer=setTimeout(tick,0);refreshSeq();});
V.act('sq-sc',function(b){stop();curSc=b.getAttribute('data-k');curStep=0;render();});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('data-act')==='sq-step'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});

/* ---------- 3. handoffs between CRM and ERP ---------- */
function lane(c){
  var n=c[1].length,pts=c[1].map(function(s,i){return {x:(i+.5)/n*100,y:s[3]==='CRM'?28:72,s:s,i:i};}),pl='';
  for(var i=1;i<n;i++){var a=pts[i-1],b=pts[i],xm=(a.x+b.x)/2;pl+='<polyline class="'+(a.y!==b.y?'cross':'')+'" points="'+a.x+','+a.y+' '+xm+','+a.y+' '+xm+','+b.y+' '+b.x+','+b.y+'" fill="none" vector-effect="non-scaling-stroke"/>';}
  return '<section class="card ln-card"><div class="ln-top"><h3>'+esc(c[0])+'</h3><p class="note" style="margin:2px 0 0">'+esc(c[2])+'</p></div><div class="ln-scroll"><div class="ln" style="--n:'+n+'"><div class="ln-band crm"><span>CRM</span></div><div class="ln-band erp"><span>ERP</span></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+pl+'</svg>'
   +pts.map(function(p){var m=V.MBY[p.s[1]];return '<a class="ln-n '+p.s[3].toLowerCase()+'" style="left:'+p.x+'%;top:'+p.y+'%" href="list.html#'+p.s[1]+'.'+p.s[2]+'"><i>'+(p.i+1)+'</i><small>'+esc(m.name)+'</small>'+esc(p.s[0])+(p.i===c[3]?'<em>handoff</em>':'')+'</a>';}).join('')+'</div></div></section>';
}
function handoffs(){
  return head('How work moves between CRM and ERP','Work starts on one side and finishes on the other, on the same record, with nothing re-keyed. The top band is CRM, the bottom band is ERP, and the line crosses between them where the handoff happens. Numbers show the order; every step opens its screen.')
   +'<div class="chains">'+V.CHAINS.map(lane).join('')+'</div>';
}

function render(){
  var tab=V.arg()||'usage';if(['usage','tech','handoffs'].indexOf(tab)<0) tab='usage';
  V.renderNav({page:'softflow'});
  V.renderTopbar('<a href="dashboard.html">Home</a> / <b>Software flow</b>');
  var body=tab==='usage'?usage():tab==='tech'?tech():handoffs();
  V.page('<div class="eyebrow">Software flow</div><h1 style="margin-top:6px">How the software works, end to end</h1><p class="lede" style="margin-top:6px">See how a customer uses the platform, how the technology behind it responds, and how work crosses between CRM and ERP.</p>'
   +'<nav class="tabs" aria-label="Software flow sections">'+TABS.map(function(t){return '<a class="tab'+(t[0]===tab?' on':'')+'" href="softflow.html#'+t[0]+'">'+esc(t[1])+'</a>';}).join('')+'</nav><div class="g-body">'+body+'</div>');
}
V.onRoute(function(){stop();curSc='late';curStep=0;render();});
};
